<style>
.project-card {
    border: none;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    height: 100%;
}

.project-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
}

.project-card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
}

.project-card .card-body {
    display: flex;
    flex-direction: column;
}

.project-card p {
    flex-grow: 1;
    margin-bottom: 1rem;
}

.project-card a.btn {
    align-self: flex-start;
}
</style>

<template data-featured-research-content>
<div class="section-card">
    <h5>Highlighted + Current Research</h5>

    <div class="row g-4 mt-2">
        <div class="col-lg-6">
            <div class="card project-card">
                <img src="pics/compass.png" alt="Compass Screenshot">
                <div class="card-body">
                    <h4 class="card-title">
                        Automated Research Onboarding Aid
                    </h4>
                    <p class="card-text">
                        Utilizing AI to help new researchers identify and explore their the gaps in their knowledge and situate themselves into their research team.
                    </p>
                    <a class="btn btn-dark"
                        href="https://reesefairchild.github.io/posters/COMPASS-5-26.pdf"
                        target="_blank">
                        Poster
                    </a>
                </div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card project-card">
                <img src="pics/citationproj.png" alt="Citation Project Screenshot">
                <div class="card-body">
                    <h4 class="card-title">
                        Analyzing Peer Review of Citations
                    </h4>
                    <p class="card-text">
                        Analyzing how researchers conduct peer review of inline citations: what citations do they prioritize, what challenges do they face, and how do they desire to use GenAI in the process?
                    </p>
                    <a class="btn btn-dark"
                        href="https://arxiv.org/abs/2610.05355"
                        target="_blank">
                        Paper
                    </a>
                </div>
            </div>
            </template>

            <script data-featured-research-script>
            document.querySelectorAll("[data-featured-research]").forEach(container => {
                const content = container.querySelector("[data-featured-research-content]");
                if (!content) return;

                container.append(content.content.cloneNode(true));
                content.remove();
            });
            </script>
        </div>
    </div>
</div>
